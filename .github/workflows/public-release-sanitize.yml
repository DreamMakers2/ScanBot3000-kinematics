name: Public release sanitization

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sanitization runner branch with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: public-release-sanitize

      - name: Audit, sanitize, verify, and rewrite retained refs
        run: python3 scripts/public_release_sanitize.py
