<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc"><title id="title">Scanbot3000 Kinematics architecture</title><desc id="desc">The operator browser loads the Three.js client from this repository. Optional live control uses a separately deployed FastAPI bridge over REST and WebSocket, which then communicates over UART with Teensy axis controllers and attached machine hardware. The API is intended for a trusted local network.</desc><defs>  <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">    <path d="M0 0 L12 6 L0 12 Z" fill="#334155"/>  </marker>  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08"/></filter>  <style>    .title { font: 700 46px Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; fill: #0f172a; letter-spacing: -0.5px; }    .subtitle { font: 400 21px Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; fill: #64748b; }    .section { font: 700 13px Inter, ui-sans-serif, Arial, sans-serif; fill: #64748b; letter-spacing: 1.7px; }    .card-title { font: 700 25px Inter, ui-sans-serif, Arial, sans-serif; fill: #0f172a; }    .chip-title { font: 700 18px Inter, ui-sans-serif, Arial, sans-serif; fill: #0f172a; }    .body { font: 400 18px Inter, ui-sans-serif, Arial, sans-serif; fill: #475569; }    .small { font: 500 15px Inter, ui-sans-serif, Arial, sans-serif; fill: #64748b; }    .label { font: 700 14px Inter, ui-sans-serif, Arial, sans-serif; fill: #334155; }    .mono { font: 600 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #334155; }  </style></defs><rect width="100%" height="100%" fill="#f8fafc"/><text x="70" y="86" class="title">Scanbot3000 Kinematics</text><text x="70" y="124" class="subtitle">Browser visualization → local control API → machine controllers</text><text x="70" y="170" class="section">OPERATOR</text><line x1="70" y1="188" x2="320" y2="188" stroke="#cbd5e1" stroke-width="1.2"/><text x="390" y="170" class="section">CLIENT APPLICATION</text><line x1="390" y1="188" x2="750" y2="188" stroke="#cbd5e1" stroke-width="1.2"/><text x="830" y="170" class="section">LOCAL API BRIDGE</text><line x1="830" y1="188" x2="1200" y2="188" stroke="#cbd5e1" stroke-width="1.2"/><text x="1280" y="170" class="section">MACHINE CONTROL</text><line x1="1280" y1="188" x2="1730" y2="188" stroke="#cbd5e1" stroke-width="1.2"/><g filter="url(#shadow)"><rect x="70" y="220" width="250" height="230" rx="18" fill="#eef4ff" stroke="#c7d8ff" stroke-width="1.4"/></g><path d="M88 220 H302 Q320 220 320 238 V274 H70 V238 Q70 220 88 220 Z" fill="#dbeafe"/><line x1="70" y1="274" x2="320" y2="274" stroke="#c7d8ff" stroke-width="1.0"/><g filter="url(#shadow)"><rect x="390" y="190" width="360" height="290" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/></g><path d="M408 190 H732 Q750 190 750 208 V244 H390 V208 Q390 190 408 190 Z" fill="#eff6ff"/><line x1="390" y1="244" x2="750" y2="244" stroke="#cbd5e1" stroke-width="1.0"/><g filter="url(#shadow)"><rect x="830" y="190" width="370" height="300" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/></g><path d="M848 190 H1182 Q1200 190 1200 208 V244 H830 V208 Q830 190 848 190 Z" fill="#eefbf3"/><line x1="830" y1="244" x2="1200" y2="244" stroke="#cbd5e1" stroke-width="1.0"/><g filter="url(#shadow)"><rect x="1280" y="190" width="290" height="300" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/></g><path d="M1298 190 H1552 Q1570 190 1570 208 V244 H1280 V208 Q1280 190 1298 190 Z" fill="#fff7ed"/><line x1="1280" y1="244" x2="1570" y2="244" stroke="#cbd5e1" stroke-width="1.0"/><g filter="url(#shadow)"><rect x="960" y="560" width="770" height="300" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/></g><path d="M978 560 H1712 Q1730 560 1730 578 V614 H960 V578 Q960 560 978 560 Z" fill="#f5f3ff"/><line x1="960" y1="614" x2="1730" y2="614" stroke="#cbd5e1" stroke-width="1.0"/><g filter="url(#shadow)"><rect x="70" y="920" width="1660" height="100" rx="18" fill="#f1f5f9" stroke="#dbe4ee" stroke-width="1.4"/></g><path d="M88 920 H1712 Q1730 920 1730 938 V964 H70 V938 Q70 920 88 920 Z" fill="#e2e8f0"/><line x1="70" y1="964" x2="1730" y2="964" stroke="#dbe4ee" stroke-width="1.0"/><text x="92" y="253" class="small">USER ENVIRONMENT</text><text x="92" y="312" class="card-title">Operator browser</text><text x="92" y="356" class="body">Loads the static interface and</text><text x="92" y="385" class="body">surfaces controls, status,</text><text x="92" y="414" class="body">and visualization output.</text><text x="414" y="224" class="small">THIS REPOSITORY · webapp/</text><text x="414" y="282" class="card-title">Three.js client</text><text x="414" y="328" class="body">Kinematics visualization</text><text x="414" y="358" class="body">Motion and scan controls</text><text x="414" y="388" class="body">Point-cloud rendering</text><rect x="414" y="404" width="266" height="30" rx="8" fill="#f1f5f9"/><text x="426" y="424" class="small">Standalone visualization supported</text><text x="414" y="452" class="small">Static HTML · CSS · JavaScript</text><text x="414" y="474" class="small">Three.js 0.157.0 · WebGL</text><text x="854" y="224" class="small">SEPARATE DEPLOYMENT</text><text x="854" y="278" class="card-title">Compatible FastAPI</text><text x="854" y="310" class="card-title">bridge</text><rect x="854" y="326" width="142" height="26" rx="7" fill="#eefbf3"/><text x="866" y="344" class="small">Documented port: 8001</text><text x="854" y="384" class="body">REST control endpoints</text><text x="854" y="414" class="body">WebSocket telemetry</text><text x="854" y="438" class="small">Backend source is not in this repository.</text><text x="854" y="462" class="small">Raspberry Pi deployment is evidenced;</text><text x="854" y="486" class="small">exact Pi model and OS are not recorded.</text><text x="1304" y="224" class="small">CONTROLLER SIDE</text><text x="1304" y="278" class="card-title">Teensy axis</text><text x="1304" y="310" class="card-title">controllers</text><text x="1304" y="384" class="body">Serial command handling</text><text x="1304" y="414" class="body">Axis coordination</text><text x="1304" y="438" class="small">Exact board and firmware versions</text><text x="1304" y="462" class="small">are not recorded in this repository.</text><line x1="320" y1="335" x2="390" y2="335" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="330" y="305" width="48" height="24" rx="6" fill="#fff" stroke="#dbe4ee"/><text x="343" y="322" class="label">UI</text><line x1="750" y1="300" x2="830" y2="300" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="750" y1="380" x2="830" y2="380" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="764" y="266" width="56" height="24" rx="6" fill="#fff" stroke="#dbe4ee"/><text x="776" y="283" class="label">REST</text><text x="760" y="319" class="mono">/api/*</text><rect x="764" y="390" width="90" height="24" rx="6" fill="#fff" stroke="#dbe4ee"/><text x="775" y="407" class="label">WebSocket</text><text x="760" y="436" class="mono">/ws/axis/r</text><line x1="1200" y1="335" x2="1280" y2="335" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="1210" y="263" width="58" height="24" rx="6" fill="#fff" stroke="#dbe4ee"/><text x="1224" y="280" class="label">UART</text><text x="1202" y="310" class="mono">/dev/serial0</text><text x="1202" y="332" class="mono">1,000,000 baud ASCII</text><line x1="1425" y1="490" x2="1425" y2="560" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="1391" y="515" width="68" height="24" rx="6" fill="#fff" stroke="#dbe4ee"/><text x="1403" y="532" class="label">Controls</text><text x="984" y="594" class="small">CONNECTED MACHINE HARDWARE</text><rect x="984" y="628" width="340" height="82" rx="12" fill="#eef4ff" stroke="#c7d8ff" stroke-width="1.1"/><text x="1000" y="659" class="chip-title">Physical axes</text><text x="1000" y="684" class="mono">r · z · x1 · x2</text><rect x="1350" y="628" width="340" height="82" rx="12" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.1"/><text x="1366" y="659" class="chip-title">TMC driver interface</text><text x="1366" y="684" class="small">Model not recorded</text><rect x="984" y="736" width="340" height="82" rx="12" fill="#eefbf3" stroke="#b7e4c7" stroke-width="1.1"/><text x="1000" y="767" class="chip-title">Z limit switch</text><text x="1000" y="792" class="small">Used by homing</text><rect x="1350" y="736" width="340" height="82" rx="12" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.1"/><text x="1366" y="767" class="chip-title">VL6180X range sensor</text><text x="1366" y="792" class="small">R-axis ranging</text><text x="94" y="950" class="small">SECURITY MODEL</text><text x="94" y="993" class="body">The documented control API is unauthenticated and intended for a trusted local network. Do not expose it directly to the public internet.</text></svg>