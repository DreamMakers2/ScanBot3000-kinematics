<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
<title id="title">ScanBot3000 Kinematics system architecture</title>
<desc id="desc">Operator browser to Three.js client to FastAPI bridge, UART-connected Teensy axis controllers, and connected machine hardware. Control API is intended only for a trusted local network.</desc>
<defs>
 <filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#12213a" flood-opacity=".09"/></filter>
 <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#1257b7"/></marker>
 <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#5b239f"/></marker>
 <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#c87900"/></marker>
