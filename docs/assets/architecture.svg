<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc">
  <title id="title">Scanbot3000 Kinematics architecture</title>
  <desc id="desc">Browser client connects through REST and WebSocket to a separate FastAPI bridge, which communicates over UART with Teensy axis controllers and attached machine hardware.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity="0.12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#40536b"/></marker>
  </defs>
  <rect width="1800" height="900" rx="36" fill="#f7f9fc"/>
  <text x="90" y="90" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#172033">Scanbot3000 Kinematics</text>
  <text x="90" y="135" font-family="Arial,sans-serif" font-size="22" fill="#5b687a">Verified public architecture and trust boundary</text>

  <g filter="url(#shadow)"><rect x="80" y="260" width="300" height="260" rx="28" fill="#fff" stroke="#dbe3ef"/><circle cx="135" cy="320" r="30" fill="#eef3fb"/><path d="M119 306h32v24h-32zM126 334h18" stroke="#315f9c" stroke-width="4" fill="none" stroke-linecap="round"/><text x="105" y="390" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#172033">Operator browser</text><text x="105" y="430" font-family="Arial,sans-serif" font-size="20" fill="#5b687a">Static HTML · CSS · JS</text><text x="105" y="465" font-family="Arial,sans-serif" font-size="20" fill="#5b687a">Three.js 0.157.0 · WebGL</text></g>

  <g filter="url(#shadow)"><rect x="520" y="210" width="360" height="360" rx="28" fill="#fff" stroke="#dbe3ef"/><circle cx="580" cy="275" r="30" fill="#eef3fb"/><path d="M563 275h34M580 258v34" stroke="#315f9c" stroke-width="4" stroke-linecap="round"/><text x="555" y="345" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#172033">Three.js client</text><text x="555" y="385" font-family="Arial,sans-serif" font-size="20" fill="#5b687a">Kinematics visualization</text><text x="555" y="420" font-family="Arial,sans-serif" font-size="20" fill="#5b687a">Motion &amp; scan controls</text><text x="555" y="455" font-family="Arial,sans-serif" font-size="20" fill="#5b687a">Point-cloud rendering</text><text x="555" y="500" font-family="Arial,sans-serif" font-size="18" fill="#315f9c">Standalone mode supported</text></g>

  <g filter="url(#shadow)"><rect x="1020" y="210" width="340" height="360" rx="28" fill="#fff" stroke="#dbe3ef"/><circle cx="1080" cy="275" r="30" fill="#eef3fb"/><path d="M1065 263h30v24h-30zM1072 294h16" stroke="#315f9c" stroke-width="4" fill="none" stroke-linecap="round"/><text x="1055" y="345" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#172033">FastAPI bridge</text><text x="1055" y="385" font-family="Arial,sans-serif" font-size="20" fill="#5b687a">Separate deployment</text><text x="1055" y="420" font-family="Arial,sans-serif" font-size="20" fill="#5b687a">REST + WebSocket</text><text x="1055" y="455" font-family="Arial,sans-serif" font-size="20" fill="#5b687a">Raspberry Pi evidenced</text><text x="1055" y="500" font-family="Arial,sans-serif" font-size="18" fill="#9a5a20">Exact Pi / OS unknown</text></g>

  <g filter="url(#shadow)"><rect x="1500" y="210" width="230" height="360" rx="28" fill="#fff" stroke="#dbe3ef"/><circle cx="1555" cy="275" r="30" fill="#eef3fb"/><path d="M1540 260h30v30h-30zM1533 270h7M1533 280h7M1570 270h7M1570 280h7" stroke="#315f9c" stroke-width="4" fill="none" stroke-linecap="round"/><text x="1535" y="345" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#172033">Teensy</text><text x="1535" y="380" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#172033">controllers</text><text x="1535" y="430" font-family="Arial,sans-serif" font-size="19" fill="#5b687a">r · z · x1 · x2</text><text x="1535" y="465" font-family="Arial,sans-serif" font-size="19" fill="#5b687a">TMC interface</text><text x="1535" y="500" font-family="Arial,sans-serif" font-size="19" fill="#5b687a">Z limit switch</text><text x="1535" y="535" font-family="Arial,sans-serif" font-size="19" fill="#5b687a">VL6180X ranging</text></g>

  <line x1="380" y1="390" x2="510" y2="390" stroke="#40536b" stroke-width="5" marker-end="url(#arrow)"/><text x="410" y="365" font-family="Arial,sans-serif" font-size="17" fill="#5b687a">UI events</text>
  <line x1="880" y1="350" x2="1010" y2="350" stroke="#40536b" stroke-width="5" marker-end="url(#arrow)"/><text x="900" y="325" font-family="Arial,sans-serif" font-size="17" fill="#5b687a">REST /api/*</text>
  <line x1="880" y1="450" x2="1010" y2="450" stroke="#40536b" stroke-width="5" marker-end="url(#arrow)"/><text x="895" y="485" font-family="Arial,sans-serif" font-size="17" fill="#5b687a">WS /ws/axis/r</text>
  <line x1="1360" y1="390" x2="1490" y2="390" stroke="#40536b" stroke-width="5" marker-end="url(#arrow)"/><text x="1375" y="350" font-family="Arial,sans-serif" font-size="17" fill="#5b687a">/dev/serial0</text><text x="1375" y="375" font-family="Arial,sans-serif" font-size="17" fill="#5b687a">1,000,000 baud</text>

  <rect x="520" y="660" width="840" height="120" rx="24" fill="#eef3fb" stroke="#d6e0ed"/><text x="555" y="710" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#172033">Security boundary</text><text x="555" y="750" font-family="Arial,sans-serif" font-size="19" fill="#5b687a">The documented control API is unauthenticated and intended for a trusted local network; it is not a public-internet service.</text>
</svg>
