<text x="34" y="70" font-size="43" class="h">SCANBOT3000 KINEMATICS</text><text x="34" y="110" font-size="25" letter-spacing="4" fill="#566272">SYSTEM ARCHITECTURE</text>
<rect x="1127" y="20" width="505" height="98" rx="12" fill="#fff" stroke="#1257b7" stroke-width="1.4"/><path d="M1160 38l24-7 24 7v20c0 20-13 33-24 38-11-5-24-18-24-38z" fill="#eaf2ff" stroke="#1257b7" stroke-width="3"/><rect x="1177" y="57" width="15" height="17" rx="2" fill="#1257b7"/><path d="M1180 57v-5a5 5 0 0110 0v5" fill="none" stroke="#1257b7" stroke-width="3"/><text x="1221" y="52" class="b blue">The control API is unauthenticated and intended</text><text x="1221" y="75" class="b blue">only for a trusted local network. Do not expose</text><text x="1221" y="98" class="b blue">it directly to the public internet.</text>
