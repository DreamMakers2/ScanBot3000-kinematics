 text{font-family:Inter,Arial,sans-serif;fill:#071426}.h{font-weight:800}.st{font-size:17px;font-weight:800}.sub{font-size:14px;font-weight:700}.b{font-size:13px;font-weight:500}.sm{font-size:11px;font-weight:600}.lab{font-size:13px;font-weight:800}.mono{font:700 11px ui-monospace,monospace}.card{fill:#fff;filter:url(#s);stroke-width:1.4}.row{fill:#fff;stroke:#ddd3ec}.foot{fill:#fff;stroke-width:1.2}.blue{fill:#1257b7}.green{fill:#137a3c}.purple{fill:#5b239f}.orange{fill:#c87900}.red{fill:#c51d1d}
 </style>
